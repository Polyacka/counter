<!DOCTYPE html>
<html>
<head>
    <title>Кнопка-счётчик</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }
        #counter {
            font-size: 48px;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>Кликер</h2>
<div id="counter">0</div>
<button onclick="mooveOne()">-2</button>
<button onclick="remoove()">remoove</button>
<button onclick="addOne()">+2</button>


<script>
    let count = 0; // Переменная для хранения числа

    function addOne() {
        count +=2;// Увеличиваем на 1// Выводим
        updateCounter()
    }
    function remoove(){
        if (count ===0){
            alert("Счётчик уже нулевой!");
        }
        else{
            count = 0;
        }
        updateCounter()
    }
    function mooveOne(){
        if (count > 0){
            count -=2;
        } else {
        }
        updateCounter()
    }
    function updateCounter(){
        document.getElementById("counter").textContent = count;
    }

</script>
</body>
</html>
</body>
</html>
